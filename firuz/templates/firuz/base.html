<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RentHub{% endblock %}</title>
</head>
<body>
    <header>
        <a href="{% url 'firuz:home' %}">RentHub</a>
        <nav>
            <a href="{% url 'smuhammad:property_list' %}">Каталог</a>
            <a href="{% url 'simple:search' %}">Поиск</a>
            <a href="{% url 'firuz:review_list' %}">Отзывы об объявлениях</a>
            {% if user.is_authenticated %}
                <a href="{% url 'firuz:profile' %}">Личный кабинет</a>
                <form method="post" action="{% url 'firuz:logout' %}">
                    {% csrf_token %}<button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'firuz:login' %}">Войти</a>
                <a href="{% url 'firuz:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    {% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
