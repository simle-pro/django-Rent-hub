{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Страницы">
    {% if page_obj.has_previous %}<a class="button button-secondary" href="?{% if search_querystring %}{{ search_querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Назад</a>{% endif %}
    <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="button button-secondary" href="?{% if search_querystring %}{{ search_querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее →</a>{% endif %}
</nav>
{% endif %}
