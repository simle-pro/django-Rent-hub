{% extends 'simple/base.html' %}
{% block title %}Заявка на аренду — RentHub{% endblock %}
{% block content %}
<section class="promo"><h1>Заявка на <span class="accent">аренду</span></h1></section>
<h2>{{ property_obj.title }}</h2>
<p>{{ property_obj.location }} — {{ property_obj.price }} за сутки</p>
<form method="post" class="glass">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить заявку</button>
</form>
<a href="{% url 'simple:search' %}">Назад к поиску</a>
{% endblock %}
